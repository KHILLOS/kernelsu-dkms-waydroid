name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast check: do the patches apply to the pinned upstream commit?
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned upstream commit
        id: pin
        run: |
          commit=$(grep -oP 'KERNELSU_COMMIT="\K[0-9a-f]+' fetch-kernelsu.sh)
          version=$(grep -oP 'KERNELSU_VERSION="\K[^"]+' fetch-kernelsu.sh)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned to $version ($commit)"

      - name: Fetch upstream
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/tiann/KernelSU.git upstream
          cd upstream
          git checkout "${{ steps.pin.outputs.commit }}"

      - name: Apply patch series
        run: |
          cd upstream
          while IFS= read -r p; do
            case "$p" in ''|'#'*) continue ;; esac
            echo "::group::apply $p"
            patch -p1 --forward --dry-run < "../patches/$p"
            patch -p1 --forward < "../patches/$p"
            echo "::endgroup::"
          done < ../patches/series

      - name: Reject leftover rejects
        run: test -z "$(find upstream -name '*.rej' -print -quit)"

      - name: Shellcheck scripts
        run: |
          shellcheck -S warning \
            fetch-kernelsu.sh install.sh uninstall.sh preflight.sh \
            waydroid-setup.sh load-kernelsu build.sh verify-build.sh

      - name: Script syntax
        run: for f in *.sh load-kernelsu; do bash -n "$f"; done

  # Real compile: run the repository pipeline inside a container pinned to a
  # kernel the module actually targets.  GitHub's ubuntu-latest runs a very new
  # kernel (7.x) that KernelSU v3.3.1 does not support, so building on the
  # runner itself is not a meaningful signal.
  compile:
    runs-on: ubuntu-latest
    needs: patches
    container: debian:13
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential dkms bc flex bison libelf-dev \
            kmod xz-utils zstd git ca-certificates

      - name: Install kernel headers
        run: |
          apt-get install -y --no-install-recommends linux-headers-amd64
          # Derive the version from the /lib/modules/<ver>/build symlink that
          # installing the headers creates.  Parsing /usr/src would also match
          # the "-common" directory and has to guess which one is right.
          KV=$(ls -1d /lib/modules/*/build | head -1 | cut -d/ -f4)
          test -n "$KV" || { echo "::error::no kernel headers found"; exit 1; }
          echo "BUILD_KERNEL=$KV" >> "$GITHUB_ENV"
          echo "target kernel: $KV"

      - name: Build with the repository pipeline
        run: |
          # DKMS picks the running kernel by default; inside a container that is
          # the host kernel, so target the headers we just installed instead.
          # Already root inside the container; sudo is not installed here.
          ./build.sh --clean || {
            echo "::error::build or verification failed - see the log above"
            exit 1
          }
        env:
          KVERSION_OVERRIDE: ${{ env.BUILD_KERNEL }}

      - name: Show module info
        run: |
          KO=$(find /var/lib/dkms/kernelsu -name 'kernelsu.ko*' | head -1)
          echo "module: $KO"
          case "$KO" in
            *.xz) xz -dc "$KO" > /tmp/kernelsu.ko ;;
            *.zst) zstd -dc "$KO" > /tmp/kernelsu.ko ;;
            *) cp "$KO" /tmp/kernelsu.ko ;;
          esac
          modinfo /tmp/kernelsu.ko | sed -n '1,12p'

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko-${{ env.BUILD_KERNEL }}
          path: /tmp/kernelsu.ko
          retention-days: 14

  # Negative test: the old configuration must be rejected by verify-build.sh.
  # This guards against a regression that reintroduces KBUILD_MODPOST_WARN or
  # drops an object from the build.
  regression-gate:
    runs-on: ubuntu-latest
    needs: patches
    steps:
      - uses: actions/checkout@v4

      - name: dkms.conf must not suppress modpost errors
        run: |
          if grep -vE '^[[:space:]]*#' dkms.conf | grep -q KBUILD_MODPOST_WARN; then
            echo "::error::dkms.conf sets KBUILD_MODPOST_WARN - unresolved symbols would be hidden"
            exit 1
          fi

      - name: No-op SELinux backend defines every required helper
        run: ./tools/check-noop-backend.sh patches/0004-selinux-noop-backend.patch
