name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast check: do the patches apply to the pinned upstream commit?
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned upstream commit
        id: pin
        run: |
          commit=$(grep -oP 'KERNELSU_COMMIT="\K[0-9a-f]+' fetch-kernelsu.sh)
          version=$(grep -oP 'KERNELSU_VERSION="\K[^"]+' fetch-kernelsu.sh)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned to $version ($commit)"

      - name: Fetch upstream
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/tiann/KernelSU.git upstream
          cd upstream
          git checkout "${{ steps.pin.outputs.commit }}"

      - name: Apply patch series
        run: |
          cd upstream
          while IFS= read -r p; do
            case "$p" in ''|'#'*) continue ;; esac
            echo "::group::apply $p"
            patch -p1 --forward --dry-run < "../patches/$p"
            patch -p1 --forward < "../patches/$p"
            echo "::endgroup::"
          done < ../patches/series

      - name: Reject leftover rejects
        run: test -z "$(find upstream -name '*.rej' -print -quit)"

      - name: Shellcheck scripts
        run: |
          shellcheck -S warning \
            fetch-kernelsu.sh install.sh uninstall.sh preflight.sh \
            waydroid-setup.sh load-kernelsu build.sh verify-build.sh

      - name: Script syntax
        run: for f in *.sh load-kernelsu; do bash -n "$f"; done

  # Real compile: run the repository pipeline inside a container pinned to a
  # kernel the module actually targets.  GitHub's ubuntu-latest runs a very new
  # kernel (7.x) that KernelSU v3.3.1 does not support, so building on the
  # runner itself is not a meaningful signal.
  compile:
    runs-on: ubuntu-latest
    needs: patches
    container: debian:13
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # Distribution mirrors do transiently 404 mid-sync; without retries a
          # single missing package fails the whole matrix entry for no reason.
          APT="apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          $APT update
          $APT install -y --no-install-recommends \
            build-essential dkms bc flex bison libelf-dev \
            kmod xz-utils zstd git ca-certificates

      - name: Install kernel headers
        run: |
          apt-get install -y --no-install-recommends linux-headers-amd64
          # Derive the version from the /lib/modules/<ver>/build symlink that
          # installing the headers creates.  Parsing /usr/src would also match
          # the "-common" directory and has to guess which one is right.
          KV=$(ls -1d /lib/modules/*/build | head -1 | cut -d/ -f4)
          test -n "$KV" || { echo "::error::no kernel headers found"; exit 1; }
          echo "BUILD_KERNEL=$KV" >> "$GITHUB_ENV"
          echo "target kernel: $KV"

      - name: Build with the repository pipeline
        run: |
          # DKMS picks the running kernel by default; inside a container that is
          # the host kernel, so target the headers we just installed instead.
          # Already root inside the container; sudo is not installed here.
          ./build.sh --clean || {
            echo "::error::build or verification failed - see the log above"
            exit 1
          }
        env:
          KVERSION_OVERRIDE: ${{ env.BUILD_KERNEL }}

      - name: Show module info
        run: |
          KO=$(find /var/lib/dkms/kernelsu -name 'kernelsu.ko*' | head -1)
          echo "module: $KO"
          case "$KO" in
            *.xz) xz -dc "$KO" > /tmp/kernelsu.ko ;;
            *.zst) zstd -dc "$KO" > /tmp/kernelsu.ko ;;
            *) cp "$KO" /tmp/kernelsu.ko ;;
          esac
          modinfo /tmp/kernelsu.ko | sed -n '1,12p'

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko-${{ env.BUILD_KERNEL }}
          path: /tmp/kernelsu.ko
          retention-days: 14

  # Multi-kernel matrix: the module must compile and pass modpost against every
  # kernel we claim to support.  Each entry is a distribution image whose
  # packaged headers represent one upstream generation; the layout of the LSM
  # hook storage differs between them, which is exactly what used to break.
  kernel-matrix:
    runs-on: ubuntu-latest
    needs: patches
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest kernels only.
          - image: debian:13
            note: 6.12 (static calls)
          - image: ubuntu:25.10
            note: 6.17 (hook heads, static calls removed)
          - image: ubuntu:26.04
            note: 7.0 (static calls)
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # Distribution mirrors do transiently 404 mid-sync; without retries a
          # single missing package fails the whole matrix entry for no reason.
          APT="apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          $APT update
          $APT install -y --no-install-recommends \
            build-essential dkms bc flex bison libelf-dev \
            kmod xz-utils zstd git ca-certificates
          # Debian tracks headers as linux-headers-amd64, Ubuntu as
          # linux-headers-generic.
          $APT install -y --no-install-recommends linux-headers-generic \
            || $APT install -y --no-install-recommends linux-headers-amd64

      - name: Resolve target kernel
        run: |
          # Containers get no /lib/modules/<ver>/build symlink, so the version
          # has to come from /usr/src.  The -common package must be skipped.
          KV=$(ls -1d /usr/src/linux-headers-*-generic \
                        /usr/src/linux-headers-*[0-9]-amd64 \
                        /usr/src/linux-headers-*+deb* 2>/dev/null \
               | sed 's|.*/linux-headers-||' | grep -vE 'common$' \
               | sort -V | tail -1)
          test -n "$KV" || { echo "::error::no kernel headers found"; exit 1; }
          echo "BUILD_KERNEL=$KV" >> "$GITHUB_ENV"
          echo "target kernel: $KV (expected ${{ matrix.note }})"

      - name: Build with the repository pipeline
        run: ./build.sh --clean
        env:
          KVERSION_OVERRIDE: ${{ env.BUILD_KERNEL }}

      - name: Show module info
        run: |
          KO=$(find /var/lib/dkms/kernelsu -name 'kernelsu.ko*' | head -1)
          test -n "$KO" || { echo "::error::no module produced"; exit 1; }
          echo "module: $KO"
          case "$KO" in
            *.xz) xz -dc "$KO" > /tmp/kernelsu.ko ;;
            *.zst) zstd -dc "$KO" > /tmp/kernelsu.ko ;;
            *) cp "$KO" /tmp/kernelsu.ko ;;
          esac
          modinfo /tmp/kernelsu.ko | sed -n '1,12p'

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko-${{ env.BUILD_KERNEL }}
          path: /tmp/kernelsu.ko
          retention-days: 14

  # Boot test: compile + link is not enough.  This job boots each distribution's
  # own kernel in QEMU and runs insmod/rmmod on the real thing, because KernelSU
  # patches syscall tables at init time and a bug there is a panic, not a build
  # error.  It is what caught the kobject_del() panic that used to take the host
  # down during install.sh's own load test.
  boot-test:
    runs-on: ubuntu-latest
    needs: patches
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest kernels only: these are the ones users actually run, and the
          # ones where upstream churn keeps breaking the module.
          - image: debian:13
            kernel: 6.12.116+deb13-amd64
          - image: ubuntu:25.10
            kernel: 6.17.0-41-generic
          - image: ubuntu:26.04
            kernel: 7.0.0-43-generic
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 podman busybox-static cpio zstd xz-utils

      - name: Boot the kernel and load the module
        timeout-minutes: 20
        env:
          PODMAN: podman
          WORKDIR: ${{ runner.temp }}/boottest
        run: |
          chmod +x tools/boottest/run.sh
          tools/boottest/run.sh "${{ matrix.image }}" "${{ matrix.kernel }}" \
            | tee result.txt

      - name: Assert the module loaded and unloaded cleanly
        run: |
          line=$(cat result.txt)
          echo "result: $line"
          fail() { echo "::error::$*"; exit 1; }
          case "$line" in *BUILD_FAIL*) fail "module did not build for this kernel";; esac
          case "$line" in *BOOT_TIMEOUT*) fail "guest never finished the test - QEMU hung or the kernel died";; esac
          case "$line" in *"INSMOD=OK"*) ;; *) fail "module failed to load";; esac
          case "$line" in *"RMMOD=OK"*) ;; *) fail "module failed to unload";; esac
          case "$line" in *"errors_before=0"*) ;; *) fail "kernel logged an error while the module was loaded";; esac
          case "$line" in *"errors_after=0"*) ;; *) fail "unloading the module left the kernel in an error state";; esac
          case "$line" in *"leftover=NO"*) ;; *) fail "module is still resident after rmmod";; esac

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-${{ matrix.kernel }}
          path: |
            result.txt
            ${{ runner.temp }}/boottest/**/boot.log
          retention-days: 14

  # Negative test: the old configuration must be rejected by verify-build.sh.
  # This guards against a regression that reintroduces KBUILD_MODPOST_WARN or
  # drops an object from the build.
  regression-gate:
    runs-on: ubuntu-latest
    needs: patches
    steps:
      - uses: actions/checkout@v4

      - name: dkms.conf must not suppress modpost errors
        run: |
          if grep -vE '^[[:space:]]*#' dkms.conf | grep -q KBUILD_MODPOST_WARN; then
            echo "::error::dkms.conf sets KBUILD_MODPOST_WARN - unresolved symbols would be hidden"
            exit 1
          fi

      - name: No-op SELinux backend defines every required helper
        run: ./tools/check-noop-backend.sh patches/0004-selinux-noop-backend.patch
