PACKAGE_NAME="kernelsu"
PACKAGE_VERSION="@PKGVER@"

BUILT_MODULE_NAME[0]="kernelsu"
DEST_MODULE_LOCATION[0]="/extra"

AUTOINSTALL="yes"

# KSU_GIT_VERSION is the git commit count of the upstream KernelSU repo.
# Substituted by fetch-kernelsu.sh from the actual clone (git rev-list --count HEAD).
#
# NOTE: KBUILD_MODPOST_WARN is deliberately NOT set.  With it, modpost turns
# "undefined symbol" errors into warnings, which lets DKMS produce a .ko that
# looks fine but cannot be loaded ("Unknown symbol ...").  Failing the build is
# the correct behaviour.
#
# CONFIG_KSU_SELINUX must stay "n" for DKMS builds: the SELinux backend needs
# the kernel's private SELinux headers (security/selinux/objsec.h, ss/policydb.h)
# which distro kernel-headers packages do not ship.  A no-op backend
# (kernel/selinux/selinux_none.c) is compiled instead.
MAKE[0]="env KVERSION=\${kernelver} KSU_GIT_VERSION=@KSU_GIT_VERSION@ CONFIG_KSU=m CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y CONFIG_KSU_NON_ANDROID=y CONFIG_KSU_SELINUX=n CONFIG_KSU_DEBUG=n CONFIG_KSU_DISABLE_MANAGER=y make KDIR=\${kernel_source_dir}"

CLEAN="make KDIR=\${kernel_source_dir} clean"
